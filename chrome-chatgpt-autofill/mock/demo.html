<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thử auto điền ChatGPT</title>
  <link rel="stylesheet" href="../popup.css">
  <style>
    body { width: auto; display: grid; grid-template-columns: 360px 1fr; gap: 24px; padding: 16px; }
    .chat { padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    #prompt-textarea { min-height: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
    #sent { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Auto điền ChatGPT</h1>
    <p class="lede">Bản thử local. Trên Chrome thật, popup gọi tab chatgpt.com.</p>
    <textarea id="text" rows="8">Xin chào, đây là bản thử auto điền.</textarea>
    <label class="check">
      <input id="autosend" type="checkbox" checked>
      Gửi tự động sau khi điền
    </label>
    <button id="run" type="button">Điền và chạy</button>
    <p id="status" role="status"></p>
  </main>
  <section class="chat">
    <h2>Ô chat giả</h2>
    <div id="prompt-textarea" contenteditable="true" data-testid="prompt-textarea"></div>
    <button data-testid="send-button" aria-label="Send prompt">Send</button>
    <p>Đã gửi:</p>
    <pre id="sent"></pre>
  </section>
  <script src="../fill.js"></script>
  <script>
    const text = document.querySelector("#text");
    const autosend = document.querySelector("#autosend");
    const run = document.querySelector("#run");
    const status = document.querySelector("#status");
    const composer = document.querySelector("#prompt-textarea");
    const send = document.querySelector("[data-testid='send-button']");
    const sent = document.querySelector("#sent");
    send.addEventListener("click", () => {
      sent.textContent = (composer.innerText || composer.textContent || "").trim();
    });
    run.addEventListener("click", () => {
      const result = window.ChatGptAutofill.fillAndSend(text.value, { send: autosend.checked });
      status.textContent = result.ok ? (autosend.checked ? "Đã điền và gửi." : "Đã điền, chưa gửi.") : result.error;
      status.className = result.ok ? "ok" : "bad";
    });
  </script>
</body>
</html>
