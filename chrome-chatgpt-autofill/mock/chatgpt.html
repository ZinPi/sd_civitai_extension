<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>ChatGPT mock</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; margin: 24px; }
    #prompt-textarea { width: 100%; min-height: 80px; padding: 8px; }
    button { margin-top: 8px; }
    #sent { white-space: pre-wrap; border-top: 1px solid #ccc; margin-top: 16px; padding-top: 8px; }
  </style>
</head>
<body>
  <h1>ChatGPT mock</h1>
  <div id="prompt-textarea" contenteditable="true" data-testid="prompt-textarea"></div>
  <button data-testid="send-button" aria-label="Send prompt">Send</button>
  <pre id="sent"></pre>
  <script src="../fill.js"></script>
  <script>
    const composer = document.querySelector("#prompt-textarea");
    const send = document.querySelector("[data-testid='send-button']");
    const sent = document.querySelector("#sent");
    send.addEventListener("click", () => {
      sent.textContent = (composer.innerText || composer.textContent || "").trim();
      sent.dataset.sent = "1";
    });
  </script>
</body>
</html>
